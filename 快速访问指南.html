<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>华诚测评系统 - 快速访问指南</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 30px;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 30px;
        }
        .option {
            padding: 20px;
            border: 2px solid #e0e0e0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            color: #333;
        }
        .option:hover {
            border-color: #667eea;
            background: #f8f9ff;
            transform: translateY(-2px);
        }
        .option-title {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 10px;
        }
        .option-desc {
            font-size: 14px;
            color: #666;
        }
        .status {
            margin-top: 30px;
            padding: 15px;
            background: #f0f9ff;
            border-radius: 10px;
            border: 2px solid #0ea5e9;
        }
        .status-running {
            background: #f0fdf4;
            border-color: #22c55e;
        }
        .arrow {
            font-size: 24px;
            color: #667eea;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 华诚集团高潜储干选拔系统</h1>
        <p style="color: #666; font-size: 16px;">选择一种方式开始使用：</p>

        <div class="options">
            <a href="../dist/index.html" class="option">
                <div class="option-title">📁 直接打开网页版</div>
                <div class="option-desc">点击直接访问系统，无需任何工具</div>
            </a>

            <div class="option" onclick="startPreview()">
                <div class="option-title">🔧 启动预览服务器</div>
                <div class="option-desc">使用本地服务器，体验完整功能</div>
            </div>

            <a href="DEPLOYMENT.md" class="option">
                <div class="option-title">☁️ 部署到云端</div>
                <div class="option-desc">查看详细部署指南，分享给他人使用</div>
            </a>
        </div>

        <div id="status" class="status">
            <p><strong>当前状态：</strong>准备就绪</p>
            <p style="font-size: 12px; color: #999; margin-top: 10px;">
                选择上方任一方式即可开始使用系统
            </p>
        </div>
    </div>

    <script>
        function startPreview() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `
                <p><strong>正在启动服务器...</strong></p>
                <p style="font-size: 12px; color: #999; margin-top: 10px;">
                    请稍候，服务器启动后将自动打开浏览器...
                </p>
            `;

            // 模拟启动预览服务器
            setTimeout(() => {
                window.open('http://localhost:4173', '_blank');
                statusDiv.className = 'status status-running';
                statusDiv.innerHTML = `
                    <p><strong>✅ 预览服务器已启动！</strong></p>
                    <p style="font-size: 12px; color: #22c55e; margin-top: 10px;">
                        浏览器窗口应该已经打开<br>
                        如果没有，请访问：<a href="http://localhost:4173" target="_blank" style="color: #0ea5e9;">http://localhost:4173</a>
                    </p>
                `;
            }, 2000);
        }
    </script>
</body>
</html>
